# git-cliff config: builds CHANGELOG.md from the Conventional Commits.
# One section per minor version (v0.2.0, v0.3.0, ...); the patch tags in between are ignored.
# Preview: pnpm changelog:preview    At a minor bump, before tagging: pnpm changelog --tag vX.Y.0

[changelog]
header = """
# Changelog

What changed in each minor version of prompt-to-part. Built from the commit messages with [git-cliff](https://git-cliff.org).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Only minor tags start a new section.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.0$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
  { message = "^test", skip = true },
  { message = "^(chore|style)", skip = true },
]
