<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lithophane production</title>
  <style>
    /* Page colours: light by default, dark for data-theme="dark" or "auto" on a dark system (src/pageTheme.ts). */
    :root { color-scheme: light; --page: #f7f4ef; --card: #fff; --ink: #1f1b16; --muted: #6f665c; --line: #e4ddd2; --field: #d6cec2; --err: #b42318; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #12110f; --card: #1b1916; --ink: #ece6dd; --muted: #a99f92; --line: #3a342d; --field: #4a433a; --err: #ff8f85; }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] { color-scheme: dark; --page: #12110f; --card: #1b1916; --ink: #ece6dd; --muted: #a99f92; --line: #3a342d; --field: #4a433a; --err: #ff8f85; }
    }
    .theme-switch { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; min-height: 36px; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
    label { font-weight: 600; font-size: .9rem; display: grid; gap: 4px; }
    textarea { font: .8rem ui-monospace, monospace; min-height: 70px; padding: 8px; border-radius: 8px; border: 1px solid var(--field); background: var(--card); color: var(--ink); }
    input[type=text], select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--field); background: var(--card); color: var(--ink); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    button { font: inherit; font-weight: 650; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--page); min-height: 44px; cursor: pointer; }
    button.alt { background: var(--card); color: var(--ink); }
    button:disabled { opacity: .4; cursor: default; }
    #status { margin: 0; font-size: .9rem; color: var(--muted); }
    #status.error { color: var(--err); }
    table { border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; font-weight: 600; padding: 4px 16px 4px 0; color: var(--muted); }
    p.small { margin: 0; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px;"><h1>Lithophane production</h1><button type="button" id="theme-switch" class="theme-switch">◐ Auto</button></header>
    <div class="card">
      <p class="small">For the shop only. Open an order, download its photo (the <b>Fotografie / Photo</b> link) and copy its <b>_litho</b> property. Everything stays in this browser.</p>
      <label><span>1. Order settings (<code>_litho</code>)</span><textarea id="settings" placeholder='{"v":1,"size":"flat-10x15",…}'></textarea></label>
      <label><span>2. Order photo</span><input type="file" id="photo" accept="image/*"></label>
      <div class="row">
        <label>Order number<input type="text" id="order-id" placeholder="#1001" size="10"></label>
        <label>Detail<select id="resolution"><option value="0.15">Very fine (0.15 mm)</option><option value="0.2" selected>Fine (0.2 mm)</option><option value="0.3">Standard (0.3 mm)</option></select></label>
        <button id="build" type="button">Build full resolution</button>
        <button id="stl" type="button" class="alt" disabled>Download STL</button>
        <button id="threemf" type="button" class="alt" disabled>Download 3MF</button>
      </div>
      <p id="status" role="status"></p>
    </div>
    <div class="card" id="result" hidden>
      <table><tbody id="facts"></tbody></table>
      <p class="small" id="note"></p>
    </div>
    <!-- The customer's widget, for checking and adjusting the framing; photos are kept at up to 6000 px here. -->
    <litho-preview lang="en" config='{"photoMaxSide": 6000}'></litho-preview>
  </main>
  <script type="module" src="./src/production.ts"></script>
  <script type="module" src="./src/pageTheme.ts"></script>
</body>
</html>
