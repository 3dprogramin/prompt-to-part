<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lithophane production</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f2ee; color: #1f1b16; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .card { background: #fff; border: 1px solid #e4ddd2; border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
    label { font-weight: 600; font-size: .9rem; display: grid; gap: 4px; }
    textarea { font: .8rem ui-monospace, monospace; min-height: 70px; padding: 8px; border-radius: 8px; border: 1px solid #d6cec2; }
    input[type=text], select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #d6cec2; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    button { font: inherit; font-weight: 650; padding: 10px 18px; border-radius: 999px; border: 1px solid #1f1b16; background: #1f1b16; color: #fff; min-height: 44px; cursor: pointer; }
    button.alt { background: #fff; color: #1f1b16; }
    button:disabled { opacity: .4; cursor: default; }
    #status { margin: 0; font-size: .9rem; color: #6f665c; }
    #status.error { color: #b42318; }
    table { border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; font-weight: 600; padding: 4px 16px 4px 0; color: #6f665c; }
    p.small { margin: 0; font-size: .85rem; color: #6f665c; }
  </style>
</head>
<body>
  <main>
    <h1>Lithophane production</h1>
    <div class="card">
      <p class="small">For the shop only. Open an order, download its photo (the <b>Fotografie / Photo</b> link) and copy its <b>_litho</b> property. Everything stays in this browser.</p>
      <label><span>1. Order settings (<code>_litho</code>)</span><textarea id="settings" placeholder='{"v":1,"size":"flat-10x15",…}'></textarea></label>
      <label><span>2. Order photo</span><input type="file" id="photo" accept="image/*"></label>
      <div class="row">
        <label>Order number<input type="text" id="order-id" placeholder="#1001" size="10"></label>
        <label>Detail<select id="resolution"><option value="0.15">Very fine (0.15 mm)</option><option value="0.2" selected>Fine (0.2 mm)</option><option value="0.3">Standard (0.3 mm)</option></select></label>
        <button id="build" type="button">Build full resolution</button>
        <button id="stl" type="button" class="alt" disabled>Download STL</button>
        <button id="threemf" type="button" class="alt" disabled>Download 3MF</button>
      </div>
      <p id="status" role="status"></p>
    </div>
    <div class="card" id="result" hidden>
      <table><tbody id="facts"></tbody></table>
      <p class="small" id="note"></p>
    </div>
    <!-- The customer's widget, for checking and adjusting the framing; photos are kept at up to 6000 px here. -->
    <litho-preview lang="en" config='{"photoMaxSide": 6000}'></litho-preview>
  </main>
  <script type="module" src="./src/production.ts"></script>
</body>
</html>
