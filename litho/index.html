<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lithophane preview demo</title>
  <style>
    /* Page colours: light by default, dark for data-theme="dark" or "auto" on a dark system (src/pageTheme.ts). */
    :root { color-scheme: light; --page: #f7f4ef; --card: #fff; --ink: #1f1b16; --muted: #6f665c; --line: #e4ddd2; --field: #d6cec2; --err: #b42318; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #12110f; --card: #1b1916; --ink: #ece6dd; --muted: #a99f92; --line: #3a342d; --field: #4a433a; --err: #ff8f85; }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="auto"] { color-scheme: dark; --page: #12110f; --card: #1b1916; --ink: #ece6dd; --muted: #a99f92; --line: #3a342d; --field: #4a433a; --err: #ff8f85; }
    }
    .theme-switch { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; min-height: 36px; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); }
    main { max-width: 1040px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .lang a { color: inherit; margin-left: 8px; }
    .cart { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .cart button { font: inherit; font-weight: 650; padding: 12px 22px; border-radius: 999px; border: 0; background: var(--ink); color: var(--page); min-height: 46px; }
    pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: .8rem; }
    p.small { font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Litofanie personalizată</h1>
      <span class="lang">Limba: <a href="?lang=ro">RO</a><a href="?lang=en">EN</a> <button type="button" id="theme-switch" class="theme-switch">◐ Auto</button></span>
    </header>
    <!-- A stand-in for a Shopify product form: the widget fills it with hidden properties[…] inputs and the photo. -->
    <form id="product-form" action="/cart/add" method="post">
      <input type="hidden" name="id" value="1001">
      <litho-preview form="product-form"></litho-preview>
      <div class="cart"><button type="submit">Adaugă în coș</button><span class="small">Demo: shows what the form would send instead of adding to a cart.</span></div>
    </form>
    <pre id="sent" hidden></pre>
  </main>
  <script type="module" src="./src/element.ts"></script>
  <script type="module" src="./src/pageTheme.ts"></script>
  <script>
    // Demo only: the language from ?lang=, and the form's fields shown instead of posting them.
    var lang = new URLSearchParams(location.search).get('lang');
    if (lang) document.querySelector('litho-preview').setAttribute('lang', lang);
    document.getElementById('product-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var out = [];
      new FormData(e.target).forEach(function (v, k) { out.push(k + ' = ' + (v instanceof File ? v.name + ' (' + v.type + ', ' + Math.round(v.size / 1024) + ' KB)' : v)); });
      var pre = document.getElementById('sent');
      pre.hidden = false;
      pre.textContent = out.join('\n');
    });
  </script>
</body>
</html>
