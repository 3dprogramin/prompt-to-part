# pnpm settings for prompt-to-part (a single package, not a workspace of several).

# Packages in node_modules/.pnpm, inside the project: the sandboxed geometry and OpenSCAD workers
# may only read node_modules (its real path, server/geometry.ts), so no package may resolve to a
# store outside it.
nodeLinker: isolated
enableGlobalVirtualStore: false
virtualStoreDir: node_modules/.pnpm

# The only dependencies whose install scripts run: esbuild fetches its binary, fsevents (macOS only)
# builds its file watcher, as npm did.
allowBuilds:
  esbuild: true
  fsevents: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.322'
  - '@anthropic-ai/claude-agent-sdk@0.3.322'
